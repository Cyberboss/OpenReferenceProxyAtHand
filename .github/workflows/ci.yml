name: "CI"

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: "build-${{ github.head_ref || github.run_id }}-${{ github.event_name }}"
  cancel-in-progress: true

# UPDATE VERSIONS HERE AND IN OpenReferenceProxyAtHand.cs. DON'T FORGET RELEASE NOTES!
env:
  OPENREFERENCEPROXYATHAND_VERSION: '1.0.0'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
        - name: Setup dotnet
          uses: actions/setup-dotnet@v6
          with:
              dotnet-version: '10.0.x'

        - name: Checkout
          uses: actions/checkout@v7

        - name: Build
          run: dotnet build -c Release

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: contains(github.event.head_commit.message, '[Deploy]') && github.event_name == 'push'
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
      contents: write
    steps:
        - name: Setup dotnet
          uses: actions/setup-dotnet@v6
          with:
              dotnet-version: '10.0.x'

        - name: Checkout
          uses: actions/checkout@v7

        - name: Publish
          run: dotnet publish -o publish /nowarn:NETSDK1194

        - name: Attest
          uses: actions/attest@v4.2.2
          with:
            subject-path: 'publish/OpenReferenceProxyAtHand.dll'

        - name: Create GitHub Release
          uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
          with:
            token: ${{ secrets.GITHUB_TOKEN }}
            tag_name: v${{ env.OPENREFERENCEPROXYATHAND_VERSION }}
            name: OpenReferenceProxyAtHand v${{ env.OPENREFERENCEPROXYATHAND_VERSION }}
            files: |
              ./publish/OpenReferenceProxyAtHand.dll
            body_path: RELEASE_NOTES.md
            target_commitish: ${{ github.event.head_commit.id }}
            make_latest: true
